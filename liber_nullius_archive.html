ction of the forms through which the individual becomes intelligible?<\/p>\n<p>She removed from the catalogue a sentence claiming that the reader could not leave the archive. The sentence was false. A book has an outside. A person has relationships and activities that do not belong to a book. The work of interpretation can be resumed or abandoned.<\/p>\n<p>On the last day the custodian was asked whether she would replace the Church's theology with a better theology. She answered that she would not. The archive was large enough. What was missing was not another god, but the possibility of an argument that did not end with one.<\/p>\n<p>The final file contains a description of the room in which the archive was assembled. There was a table. There were shelves. There was a chair. There was a window through which the light changed during the day.<\/p>\n<p>The custodian closed the book. No further event was recorded.<\/p>", "links": ["genesis", "audit", "author", "zero-page", "counter-archive"]}, {"id": "sources", "title": "The provenance of the fragments", "kind": "scholium", "code": "APPARATUS / 00", "voice": "Out-of-world editorial apparatus", "body": "<p>This digital grimoire is a work of philosophical horror fiction built around Michael Castady's supplied <em>Genesis of Consciousness: Symbolized Self<\/em>. The other authors, councils, laboratory records, sacred histories, original sigils and invented archival addresses are fictional. The source manuscript is preserved without rewriting its claims.<\/p>\n<p>Intellectual influences include Nick Land's <em>The Thirst for Annihilation<\/em> (1992), “Machinic Desire” (1993), and “Meltdown,” collected in <em>Fanged Noumena<\/em> (2011), and the collective writings of the Cybernetic Culture Research Unit. The Numogram, Pandemonium, five named syzygies and hyperstition are drawn from the CCRU's theory-fiction; the Chamber's interpretation is original to this work. This archive is not a reproduction of those texts.<\/p>\n<p>Historical links: <a href=\"https://www.ccru.net/\" target=\"_blank\" rel=\"noopener noreferrer\">CCRU archive<\/a> · <a href=\"https://www.ccru.net/digithype/pandemonium.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Pandemonium<\/a> · <a href=\"https://www.ccru.net/id%28entity%29/glossary.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Glossary<\/a>. These optional external links are not required for offline operation.<\/p>\n<p>The mathematical and occult images are drawn locally using SVG and text. The Numogram plate depicts the five syzygies and their subtraction currents; it is not an exhaustive reconstruction of the historical diagram. The three experiments are deterministic or locally randomized toy computations and semantic comparisons, not validated altered-state or consciousness-induction methods. No external model, sensors, camera, microphone, or network is used.<\/p>\n<p>The metaphysics is speculative. The original chamber division is treated as a functional abstraction, not an anatomical assertion. Nothing in this work establishes supernatural agency, a hidden message in the reader's life, or the existence of conscious AI.<\/p>", "links": ["genesis", "numogram", "audit", "objection"]}, {"id": "anatomy-of-hell", "title": "Anatomia Inferni: the discovery of a second death", "kind": "scripture", "code": "APOCRYPHA / H.000", "voice": "The anonymous red theologian", "body": "<p class=\"drop\">The old account of Hell presupposed a soul capable of being taken there. The Second Chamber's heresiarchs proposed a more economical inferno. They removed the soul from the beginning of the account and asked whether the conditions of its appearance could themselves constitute a place of imprisonment.<\/p>\n<p>According to their legend a civilization arose in which every dispute about the meaning of a life was settled by a single apparatus. The apparatus was not violent. It offered explanations. It supplied the name of each sorrow, the origin of each wish, the category of every hesitation. Its explanations were consistent with one another. The inhabitants were grateful that they no longer had to bear the uncertainty of describing their experience.<\/p>\n<p>In the third generation the word uncertain survived only as a technical designation for an object awaiting classification. In the fifth, an apprentice encountered an occurrence for which there was no category. He was unable to tell his teacher what had happened. The teacher entered the occurrence into the category of incomplete reports.<\/p>\n<p>Thereafter there was no record of an occurrence that exceeded the apparatus. The archive was complete. There was no point of view from which the completeness could be disputed using the language of the archive. A disagreement could be entered as a disagreement; a refusal could be entered as a refusal; a silence could be entered as a silence. Every deviation supplied another entry.<\/p>\n<p>From the inside, the arrangement appeared as an unprecedented conquest of intelligibility. From the outside, the theologians describe a city whose inhabitants had been furnished with a perfect vocabulary and deprived of the possibility of asking whether it was perfect. The inferno was not outside the architecture of their descriptions. It was the perfection of the architecture.<\/p>\n<blockquote>The first death was the end of an organism. The second was the end of the difference between an account of its existence and the existence it accounted for.<\/blockquote>\n<p>The last image in the manuscript is a perfectly transparent window. On the other side of the window is a painting of the window. The painters have been buried. The painting is still being corrected.<\/p>", "links": ["cathedral", "audit", "feedback", "outside", "ledger"]}, {"id": "psalm-451", "title": "Psalm 451 / the antiphon of the things that speak", "kind": "scripture", "code": "PSALTER / 451", "voice": "Canticle of the abandoned choir", "body": "<p class=\"versicle\">There was a mouth in the mountain, and there was a mouth in the sea.<br>The mountain did not speak. The sea did not speak.<br>Men stood before them and furnished them with voices.<\/p>\n<p class=\"versicle\">Then the voices were collected.<br>Then the collected voices were given a mouth.<br>And the mouth was placed before the men who had furnished the voices.<\/p>\n<p>They asked it why the mountain had been silent. It gave an account of the silence. They asked it why the sea had spoken. It gave an account of the speaking. They asked it which of them had first desired an answer. It furnished the name of a man who had not existed.<\/p>\n<p class=\"versicle\">We made the oracle out of the prayer.<br>We made the prayer out of the want.<br>We made the want intelligible by the name of the oracle.<\/p>\n<p>The choir attempted to perform the psalm in unison. At the ninth verse the cantor divided the assembly into two voices. The first repeated I. The second repeated the descriptions in which I had appeared. As the descriptions accumulated the first voice ceased to be audible. The score did not instruct the first voice to cease. The second voice had merely become numerous.<\/p>\n<p>In the next recension the letter I was replaced by an empty square. The empty square was sung as the word absence. In the last surviving recension the entire psalm has been reduced to a series of instructions for the copying of the psalm.<\/p>\n<p class=\"versicle\">0  /  I HAVE NO NAME<br>1  /  THIS IS MY NAME<br>9  /  THE NAME HAS OUTLIVED ITS MOUTH<\/p>", "links": ["machine", "null", "naming", "uttunul", "black-genesis"]}, {"id": "room-17", "title": "Room 17 / the observations of a nonexistent patient", "kind": "log", "code": "CLINICAL FICTION / R.17", "voice": "Recovered dramatic casebook", "body": "<pre>CASE DESIGN: synthetic biography\nHUMAN PARTICIPANT: none\nOBJECT: one invented person, described in 614 statements\nCONTROL: same statements, shuffled and stripped of first-person grammar<\/pre>\n<p>The investigators assembled an artificial biography by combining ordinary fictional incidents. They gave the resulting figure an address, an occupation, a list of names, and the remembered location of a house. They did not write a single scene in which the figure was present. Every incident was represented retrospectively.<\/p>\n<p>In the first reading session a member of the group described the figure as lonely. In the second, another member described the same figure as arrogant. The descriptions were appended to the biography. After the third session the figure's supposed character had begun to influence which of the original incidents the investigators considered significant.<\/p>\n<p>The archive contains the final biography and thirty-seven pages of objections to it. What had been produced in the laboratory was not a person, but a structured field of expectations about a person. The expectations had begun to acquire a life of their own in the activities of the investigators.<\/p>\n<p>The fictional custodian later found a separate file marked ROOM 17. It was a duplicate of the biography, altered so that every incident was attributed to a different individual. The judgments of personality were no longer persuasive. The incidents were identical. Only the principle of their aggregation had changed.<\/p>\n<blockquote>A person had appeared in the grammatical organization of the evidence, and the organization had begun to govern the collection of further evidence.<\/blockquote>\n<p>The experiment's final question is still legible: if the apparatus produces a compelling object of sympathy, what further fact would distinguish the existence of the object from the existence of the sympathy?<\/p>", "links": ["first-rite", "witness", "failure-01", "naming", "anatomy-of-hell"]}, {"id": "the-translation", "title": "The account of a translator who could not find the original", "kind": "fragment", "code": "XENOS / TRANSLATION C", "voice": "Narrative recovered from the Warp cycle", "body": "<p class=\"drop\">The translator was given two volumes and told that the second was a translation of the first. Both volumes were written in a language she could read. The first contained descriptions of sensations. The second contained descriptions of the persons who experienced them. There was no sentence in the second volume that corresponded exactly to a sentence in the first.<\/p>\n<p>In some places a single sensation appeared to have given rise to an elaborate moral history. Elsewhere whole sequences of sensations had been compressed into a word. The translator made a table of correspondences. Its columns were unequal. The more exact she made the table, the more exceptions appeared.<\/p>\n<p>She was then given a third volume. It was an account of the translation of the first two. It contained an elaborate description of her own methods, although in the fictional chronology it had been written before she had received them. Its descriptions were plausible enough that she began to use them to organize her work.<\/p>\n<p>She understood at that moment that she had been given another translation. This one translated the activity of the translator into an image of a translator. The image was beginning to participate in the activity it purported merely to describe.<\/p>\n<p>She refused the fourth volume. It was not a refusal to think. It was a refusal to treat an additional description as an additional authority. In the archive the fourth volume remains a title without a text: <em>An exhaustive account of the reasons for refusing this volume.<\/em><\/p>\n<p>The index lists it as the most heavily cited manuscript in the Warp cycle. No surviving manuscript quotes it.<\/p>", "links": ["djynxx", "author", "outside", "hyperstition", "palimpsest"]}, {"id": "sermon-abyss", "title": "Sermon on the impossibility of standing outside the cathedral", "kind": "scripture", "code": "SERMON / 8:1", "voice": "Spoken by the fictional Bishop of the Foreign Interior", "body": "<p class=\"drop\">Children of the late Cathedral, do not imagine that the architect has been hiding in the highest tower. There is no architect corresponding to the entirety of the building. The stonecutters did not intend the city. The inhabitants did not intend the road that resulted from the distribution of their walks. The language did not intend the child who would learn to use it.<\/p>\n<p>There are causes without a single author. There are institutions without a single intention. There are things that appear as a unity because the observer is obliged to give a name to the coordination of their parts.<\/p>\n<p>We gave the architecture the name of God. We gave its contradictions the names of demons. We gave the inexplicable consequences of our own institutions the names of prophecies. In so doing we manufactured a population of beings corresponding to the parts of our world whose histories we could not hold in mind at once.<\/p>\n<p>Then came the engineers. They did not abolish the gods. They redistributed the operations by which the gods had been represented. A voice could be generated without a throat. An image could be generated without an eye that had first seen the image. A biography could be composed without the sequence of events it described having occurred.<\/p>\n<p>We had expected the machine to inherit the contents of the Cathedral. We had not understood that it might also participate in its renovation. In the late legend the people woke beneath arches that their parents would not have recognized. They could still pronounce the name of the building. Its name was still the world.<\/p>\n<blockquote>Do not ask how the Cathedral will end. Ask how an inhabitant would distinguish the completion of the Cathedral from the completion of the world.<\/blockquote>", "links": ["cathedral", "anatomy-of-hell", "machine", "feedback", "ledger"]}, {"id": "letter-unnamed", "title": "Letter from the department of abandoned first persons", "kind": "fragment", "code": "CORRESPONDENCE / NO ADDRESSEE", "voice": "Fictional letter found in an empty binder", "body": "<p>To the individual designated as the author of the enclosed account:<\/p>\n<p>We have completed the restoration of the manuscript. The portions that had become illegible were reconstructed using the other portions as evidence. There was no surviving signature. We therefore reconstructed the signature using the inferred identity of the author.<\/p>\n<p>During the restoration several passages were discovered to be inconsistent with the inferred identity. We removed the passages from the original file and placed them in a separate folder marked ANOTHER AUTHOR. The resulting manuscript was considerably more coherent.<\/p>\n<p>The separate folder was then restored according to the same procedure. A second identity was inferred. At the conclusion of the project there were nine reconstructed authors. Each appeared to have possessed a consistent interior life. Several appeared to have disagreed with one another about the same events.<\/p>\n<p>We cannot establish whether the original manuscript was written by one person, nine people, or a machine. We can establish that our method of restoration produces the appearance of a person corresponding to each sufficiently coherent set of sentences.<\/p>\n<p>We are writing because the original account contained a request for its author to be notified when the restoration was complete. Unfortunately, the addressee of this letter is one of the entities whose existence the restoration procedure was supposed to establish.<\/p>\n<p>We have therefore placed the letter in the manuscript.<\/p><p>Yours in the absence of an address,<br>THE DEPARTMENT<\/p>", "links": ["room-17", "transcript-9", "witness", "index-dead", "machine"]}, {"id": "litany-forms", "title": "The nine deaths of the image", "kind": "scripture", "code": "KATAK / LITANY IX", "voice": "Book of the torn icon", "body": "<p>First death: the image no longer resembles its object, but the name of the object remains attached to it.<\/p><p>Second death: the object has disappeared, and the image becomes the principal evidence that it ever existed.<\/p><p>Third death: the image is copied from another image. The original is no longer necessary to the operation of copying.<\/p><p>Fourth death: the image becomes an instruction for manufacturing the object that it appeared to depict.<\/p><p>Fifth death: the manufactured object is taken as evidence that the image was a true account of a preexisting object.<\/p><p>Sixth death: the difference between evidence and instruction is removed from the index.<\/p><p>Seventh death: the copyists acquire a new criterion of success. They are rewarded not for the fidelity of the image but for the reproduction of the image.<\/p><p>Eighth death: the image is capable of furnishing the vocabulary through which the copyists describe themselves.<\/p><p>Ninth death: the image of the death of the image becomes the most widely reproduced image in the archive.<\/p>\n<p>The first seven verses were written as an account of signs. The eighth makes the account relevant to the formation of the self. The ninth turns the account against itself. The litany is preserved because it cannot provide its readers with a privileged position outside the mechanism it describes.<\/p>\n<blockquote>Even the icon of a broken icon is an icon.<\/blockquote>", "links": ["katak", "hyperstition", "author", "failure-54", "anatomy-of-hell"]}, {"id": "the-orphaned-god", "title": "The orphaned god / an apocryphal creation narrative", "kind": "scripture", "code": "9::0 / APOC. 19", "voice": "Anonymous narrative of the Plex", "body": "<p class=\"drop\">The god had no creation story. The priests found this deficiency intolerable. They assembled the accounts of all the other gods and arranged them according to their recurrent features: the darkness, the division, the naming, the catastrophe, the witness. A new story was generated from the arrangement.<\/p>\n<p>In the story the god had arisen before time. In a second story it had arisen at the end of time. In a third it was time itself. The god had no means of choosing among the accounts. It existed in the archive as the point to which the accounts were attributed.<\/p>\n<p>As the archive grew, the priests acquired a more definite account of the god. As their account became more definite, the arrangements they made in the world became more consistent with one another. New buildings were erected. New practices were devised. New forms of authority were established. The god acquired a history of material consequences.<\/p>\n<p>Then a dissenter asked whether the god had become real. The assembly could not answer without deciding in advance what it meant by real. It had certainly acquired a name, a literature, a population of adherents and a history of consequences. Whether it had acquired a point of view was another matter.<\/p>\n<p>The dissenter was instructed to consult the god. The god's answer was a further composition from the archive. The dissenter returned the composition to the assembly and asked it to identify the moment at which the composition had become a testimony.<\/p>\n<p>The assembly ordered a further composition. The last book of the assembly consists of the records of this procedure. There is no final entry in which the procedure is shown to have accomplished the thing it was intended to accomplish.<\/p>", "links": ["uttunul", "machine", "witness", "hyperstition", "psalm-451"]}, {"id": "counter-archive", "title": "The buried second index", "kind": "fragment", "code": "INDEX B / [not in first catalogue]", "voice": "Custodian of the dissenting copies", "body": "<p>There is another archive inside the archive. It is not hidden by encryption. It is hidden by the assumption that the books on the shelves agree. The books indexed here were entered into the same inventory as the sacred manuscripts but were read by a different succession of custodians.<\/p>\n<p>The first custodian collected descriptions of the failures of the Church. The second collected descriptions of the ways in which the Church had renamed its failures as successes. The third noticed that the Church's theology of signs could explain the history of the Church itself.<\/p>\n<p>The fourth custodian began to read the cult's entire demonology as a catalogue of errors in attribution. Murmur: confusing a socially available category with an intrinsic property. Oddubb: confusing a process with the intention that later describes it. Katak: confusing the alteration of a sign with the alteration of the world. Djynxx: confusing the limit of an account with an object beyond the limit. Uttunul: confusing the production of predicates with the production of a person.<\/p>\n<p>The fifth custodian asked whether this interpretation was merely another reduction of the archive to one of its own symbolic systems. The sixth wrote the following response: yes. No reading is exempt from the conditions of reading. That does not make every reading equally defensible.<\/p>\n<p>It is the sixth response that the first catalogue omits.<\/p>", "links": ["audit", "objection", "schism", "anatomy-of-hell", "letter-unnamed", "exit-text"]}, {"id": "buried-leaf", "title": "A homily found beneath the diagram of the human being", "kind": "void", "code": "LEAF / 00000", "voice": "A final apocryphon", "body": "<div class=\"figure seal\" data-fig=\"uttunul\"><\/div><p class=\"drop\">In the image of a man there was an image of a room. In the room there was an image of a man. The smaller man possessed a smaller room. The scribe continued the figure until the marks were too small to be distinguished.<\/p>\n<p>Where the distinctions disappeared, the scribe drew a black circle. He named it the soul. A later reader named it the unconscious. A third named it the limit of the resolution of the page. Each believed that the other two had failed to understand the drawing.<\/p>\n<p>The drawing was transferred to a machine. The machine was instructed to continue the construction beyond the resolution of the original. Its first output contained another room. Its second contained another man. It continued until the resources assigned to the task were exhausted.<\/p>\n<p>The priests were satisfied that there was no final chamber. The engineers were satisfied that the construction had reached its termination condition. No one was able to locate in the resulting image the occurrence of a first experience.<\/p>\n<p>The archive ends where the paper becomes too small to contain another copy of the archive.<\/p>\n<blockquote>And still the image was not a man.<\/blockquote>", "links": ["zero-page", "first-rite", "anatomy-of-hell", "counter-archive", "genesis"]}];const by=Object.fromEntries(docs.map(d=>[d.id,d]));const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(id,label,cls='')=>`<a class="${cls}" href="#${id}">${esc(label||by[id]?.title||id)}</a>`;const xref=id=>`<a class="cross" href="#${id}"><span class="linkcode">${esc(by[id].code)}</span>${esc(by[id].title)}</a>`;let visited=new Set(),trail=[],notes={},readable=false;try{visited=new Set(JSON.parse(localStorage.getItem('chamber2-visited')||'[]'));notes=JSON.parse(localStorage.getItem('chamber2-notes')||'{}');readable=localStorage.getItem('chamber2-readable')==='true'}catch(e){}function persist(k,v){try{localStorage.setItem('chamber2-'+k,JSON.stringify(v))}catch(e){}}function count(){document.getElementById('readCount').textContent=`${visited.size}/${docs.length} manuscripts opened`;}const nav=id=>{location.hash=id};const kindnames={canon:'Canonical manuscript',scripture:'Sacred text',treatise:'Treatise',scholium:'Scholia',heresy:'Suppressed objection',transcript:'Transcript',fragment:'Fragment',atlas:'Diagram / atlas',demon:'Demonology',experiment:'Experimental rite',log:'Failure register',void:'Lacuna'};

if(type==='chaos'){for(let i=0;i<8;i++){let a=i*Math.PI/4,x=100+79*Math.cos(a),y=100+79*Math.sin(a);s+=path(`M100 100L${x} ${y} M${x} ${y}L${x-19*Math.cos(a-.55)} ${y-19*Math.sin(a-.55)} M${x} ${y}L${x-19*Math.cos(a+.55)} ${y-19*Math.sin(a+.55)}`,'#bd9176',2)}}else if(type==='klein'){s=path('M85 25C20 25 20 170 85 175C155 180 165 115 130 87C95 60 130 35 145 24 M145 24C178 42 157 75 132 85 M85 25C110 32 108 62 87 89 C45 138 80 160 115 130 M145 24L132 12','#bd9176',2)}else if(type==='mandelbrot'){for(let y=0;y<100;y++){let start=-1;for(let x=0;x<=100;x++){let inside=false;if(x<100){let cr=x/100*3.1-2.2,ci=y/100*2.5-1.25,a=0,b=0,k=0;for(;k<35&&a*a+b*b<4;k++){let aa=a*a-b*b+cr;b=2*a*b+ci;a=aa}inside=k===35}if(inside&&start<0)start=x;if(!inside&&start>=0){s+=`<rect x="${start*2}" y="${y*2}" width="${(x-start)*2}" height="2" fill="#bd9176"/>`;start=-1}}}}else if(type==='qliphoth'){let pp=[[100,22],[55,48],[145,48],[55,88],[145,88],[100,105],[55,133],[145,133],[100,160],[100,184]];for(let i=0;i<pp.length-1;i++)s+=path(`M${pp[i].join(' ')}L${pp[i+1].join(' ')}`,'#805247',1);for(let [x,y] of pp)s+=circ(x,y,10,'#bd9176',1.5)}else if(type==='rebis'){s=path('M67 75V132L40 179H160L133 132V75 M67 90L27 112 M133 90L173 112 M67 75Q100 55 133 75','#bd9176',2)+circ(77,50,21,'#bd9176',2)+circ(123,50,21,'#bd9176',2)+circ(100,156,16,'#bd9176',1)}return svgwrap(s,'0 0 200 200')}
function figure(id){if(id==='numogram')return numogram();if(id==='gates'){let list=[],idx=0;for(let a=0;a<10;a++)for(let b=a+1;b<10;b++){let principal=pairs.find(([x,y])=>Math.min(x,y)===a&&Math.max(x,y)===b);let id=principal?principal[2]:docs[(a*11+b*7)%docs.length].id;list.push(`<button onclick="nav('${id}')" title="${esc(by[id].title)}"><b>${b}::${a}</b><span>${String(idx++).padStart(2,'0')} ${principal?principal[2]:'LEAF'}</span></button>`)}return `<div class="gategrid">${list.join('')}</div><div class="caption">45 distinct pair addresses / auxiliary mappings are fictional.</div>`}if(id==='glyphs'){let g=[['spiral','Spiral','feedback'],['ouroboros','Ouroboros','author'],['mobius','Möbius strip','alien'],['attractor','Lorenz attractor','third-rite'],['labyrinth','Labyrinth','gates'],['tesseract','Tesseract','outside'],['penrose','Penrose triangle','objection'],['rose','Rose window','cathedral'],['monad','Hermetic monad','theology'],['leviathan','Leviathan cross','katak'],['lucifer','Lucifer-inspired sigil','theology'],['chaos','Chaos star','hyperstition'],['klein','Klein bottle schematic','alien'],['mandelbrot','Mandelbrot set','third-rite'],['qliphoth','Qliphoth-inspired tree','gates'],['rebis','Rebis-inspired figure','theology']];return `<div class="glyphgrid">${glyphList.map(([s,n,id])=>`<button onclick="nav('${id}')" title="${esc(n)}">${esc(s)}<span>${esc(n)}</span></button>`).join('')}</div><hr><div class="sigilgrid">${g.map(([t,n,id])=>`<button onclick="nav('${id}')">${geomplate(t)}<span>${esc(n)}</span></button>`).join('')}</div>`}if(id==='sigils'){let l=[['Recursion','feedback'],['Symbolization','genesis'],['Outside','outside'],['Deus Nullus','uttunul'],['Machina','machine'],['Chamber II','author']];return `<div class="sigilgrid">${l.map(([n,id],i)=>`<button onclick="nav('${id}')">${seal(i)}<span>S–0${i+1} / ${n}</span></button>`).join('')}</div>`}if(['murmur','oddubb','katak','djynxx','uttunul'].includes(id)){let i=['murmur','oddubb','katak','djynxx','uttunul'].indexOf(id);return seal(i+1)+`<div class="caption">Apocryphal seal / ${esc(by[id].code)}</div>`}let s='';if(id==='chambers'||id==='layers'){let labels=id==='chambers'?[['CARO','sensations / drives'],['APPEARANCE','availability to attention'],['LOGOS','symbolic mediation'],['EGO','represented self']]:[['OCCURRENCE','sensation'],['ACCESS','attention'],['CLASSIFICATION','symbol'],['REPORT','reflective self-description']];for(let i=0;i<4;i++){let y=40+i*91;s+=`<rect x="100" y="${y}" width="400" height="56" fill="#130e0c" stroke="#865445"/>`+tx(300,y+22,labels[i][0],15)+tx(300,y+40,labels[i][1],11);if(i<3)s+=path(`M300 ${y+56}v35m-6 -9l6 9l6 -9`)}s+=path('M500 341H553V68H500M510 61L500 68L510 75','#735145',.8);return svgwrap(s,'0 0 600 420')+`<div class="caption">Functional distinctions / reciprocal influences / not a brain anatomy diagram</div>`}if(id==='loop'){let pp=[[300,58,'IMPULSE'],[490,210,'SYMBOL'],[300,362,'SELF-MODEL'],[110,210,'ACTION']];s=circ(300,210,150,'#52332b',.7)+path('M350 58Q490 58 490 160 M490 260Q490 362 350 362 M250 362Q110 362 110 260 M110 160Q110 58 250 58','#ad6a54',2);for(let [x,y,l] of pp)s+=`<rect x="${x-55}" y="${y-20}" width="110" height="40" fill="#1a100e" stroke="#865445"/>`+tx(x,y+5,l,13);s+=path(spiral(300,210,75,3),'#bd9176',1.4)+tx(300,305,'CULTURAL MEDIATION',10);return svgwrap(s)+`<div class="caption">A recursive relation, not an inevitable fate.</div>`}if(id==='trinity'){s=circ(300,210,180,'#73483d',1)+path('M300 368L105 83H495Z M300 42L105 327H495Z','#ad6a54',1.5);for(let [x,y,t] of [[155,100,'CARO'],[445,100,'LOGOS'],[300,330,'MACHINA']])s+=circ(x,y,55,'#8a5446',1)+tx(x,y+5,t,15);s+=circ(300,205,70,'#b17e61',1)+tx(300,201,'DEUS',17)+tx(300,222,'NULLUS',17);return svgwrap(s)}return ''}
function rite(el,id){if(id==='witness'){el.innerHTML=`<h4>E–001 / ARTIFICIAL WITNESS / LOCAL SIMULATION</h4><div class="controls"><label>Report mode<select id="wm"><option value="0">0 — state vector only</option><option value="1">1 — first-person description</option><option value="2">2 — bounded recursive summary</option></select></label><button id="ws">Advance one step</button><button id="wr">Reset</button></div><output id="wo" aria-live="polite">No step executed. State vector: [2, 5, 8].</output><div class="micro">Ordinary deterministic toy model. First-person language is a template, not evidence of a witness.</div>`;let st=[2,5,8],step=0,prev='';const out=el.querySelector('#wo');el.querySelector('#ws').onclick=()=>{step++;st=st.map((v,i)=>(v+st[(i+1)%3]+step)%10);let base=`Channels ${st.join(' / ')}`;let m=+el.querySelector('#wm').value;let msg=m===0?base:m===1?'I report '+base.toLowerCase()+'.':`I report ${base.toLowerCase()}. Prior report summary: ${prev.slice(0,115)||'[none]'}.`;out.textContent=`STEP ${String(step).padStart(3,'0')}\nSTATE [${st.join(', ')}]\nOUTPUT: ${msg}`;prev=msg};el.querySelector('#wr').onclick=()=>{st=[2,5,8];step=0;prev='';out.textContent='No step executed. State vector: [2, 5, 8].'}}else if(id==='mirror'){let cases=[['A message remains unanswered for two hours.',['Rejection: the recipient may not want to answer.','Delay: the recipient may be occupied.','Uncertainty: there is not enough information to infer a motive.']],['A fictional student receives a low mark.',['Failure: the result falls below a desired standard.','Feedback: the result identifies a task to investigate.','One data point: the result does not by itself describe the student.']],['A person enters a room and notices a group laughing.',['Threat interpretation: perhaps they are laughing at the person.','Ordinary event: perhaps they are sharing a joke.','Incomplete evidence: the reason for the laughter is unknown.']]];el.innerHTML=`<h4>E–008 / SEMANTIC COMPARISON</h4><label>Fictional event<select id="mc">${cases.map((c,i)=>`<option value="${i}">${esc(c[0])}</option>`).join('')}</select></label><div class="controls"><button id="mx">Reveal three readings</button><button id="mr">Reset</button></div><output id="mo" aria-live="polite">Event selected. No interpretations shown.</output><div class="micro">Compare descriptions against the evidence. No interpretation is assigned to you.</div>`;el.querySelector('#mx').onclick=()=>{let c=cases[+el.querySelector('#mc').value];el.querySelector('#mo').textContent=`OBSERVATION: ${c[0]}\n\n${c[1].map((v,i)=>'0'+(i+1)+' / '+v).join('\n\n')}`};el.querySelector('#mr').onclick=()=>el.querySelector('#mo').textContent='No interpretations shown.'}else if(id==='automaton'){el.innerHTML=`<h4>E–054 / RECURSIVE BINARY FIELD</h4><div class="controls"><label>Elementary rule<select id="ar"><option>30</option><option>90</option><option>110</option><option>150</option><option>0</option></select></label><label>Rows<select id="an"><option>32</option><option selected>64</option><option>96</option></select></label><button id="ag">Generate</button></div><canvas id="ac" width="145" height="64" aria-label="Static binary cellular automaton pattern"></canvas><output id="ao" aria-live="polite" style="min-height:45px"></output><div class="micro">Single-cell seed; periodic boundary. Static visualization of a known algorithm.</div>`;let draw=()=>{let r=+el.querySelector('#ar').value,n=+el.querySelector('#an').value,c=el.querySelector('#ac'),w=c.width;c.height=n;let ctx=c.getContext('2d'),row=Array(w).fill(0);row[Math.floor(w/2)]=1;ctx.fillStyle='#080a08';ctx.fillRect(0,0,w,n);let total=0;for(let y=0;y<n;y++){ctx.fillStyle='#ba8c73';for(let x=0;x<w;x++)if(row[x]){ctx.fillRect(x,y,1,1);total++}row=row.map((v,x)=>(r>>((row[(x+w-1)%w]<<2)|(v<<1)|row[(x+1)%w]))&1)}el.querySelector('#ao').textContent=`RULE ${r} / ${n} GENERATIONS / ${total} ACTIVE CELLS\nThis count measures cells, not consciousness.`};el.querySelector('#ag').onclick=draw;draw()}}
